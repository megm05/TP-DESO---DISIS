# ==============================================================
#  Configuración del sistema de Gestión de Evaluaciones de Perfiles
# ==============================================================
# Conexión a PostgreSQL. Cree antes la base de datos vacía, por ejemplo:
#     CREATE DATABASE rrhh;
# La primera vez que se ejecuta, el sistema crea las tablas solo.
db.url=jdbc:postgresql://localhost:5432/rrhh
db.usuario=postgres
db.clave=postgres

# Puerto donde atiende el sistema (http://localhost:8080)
servidor.puerto=8080

# true: al crear las tablas carga datos de prueba (consultores, competencias,
# factores, preguntas, puestos y candidatos). false: crea las tablas vacías.
datos.demo=true
